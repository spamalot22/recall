name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build and test server
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test
          npm audit --audit-level=moderate
      - name: Build production server image
        run: docker build --tag recall-server:ci server
      - name: Validate pull-only LAN Compose stack
        env:
          DATABASE_URL: postgres://recall:ci-database-password-1234@recall_db:5432/recall
          JWT_ACCESS_SECRET: ci-access-secret-with-at-least-thirty-two-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-thirty-two-characters
          POSTGRES_DB: recall
          POSTGRES_PASSWORD: ci-database-password-1234
          POSTGRES_USER: recall
          RECALL_API_BIND_ADDRESS: 192.168.1.10
          TAG: ci
        run: |
          docker compose config --quiet
          docker compose config --format json | node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(0, "utf8"));
            const api = config.services.api;
            if (api.image !== "ghcr.io/spamalot22/recall-server:ci" || api.build) {
              throw new Error("API must use the expected pull-only GHCR image");
            }
          '

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and test app
        working-directory: app
        run: |
          (cd assets/models && sha256sum --check SHA256SUMS)
          flutter pub get
          flutter analyze
          flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --dart-define=APP_VERSION=ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
